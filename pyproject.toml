[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdip"
version = "0.1.0"
description = "Financial Document Intelligent Processing: backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "passlib[argon2]>=1.7.4",
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-passlib",
]

[project.scripts]
fdip = "fdip.cli:main"

[tool.setuptools.packages.find]
include = ["fdip*"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
# The same set the toolkit and the benchmark use, for the same reasons: percent
# formatting is clearer than an f-string for a table row or a padded id, and the
# line limit is advisory rather than enforced on prose in docstrings.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP031", "B905"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` and `File(...)` in a default is FastAPI's documented idiom, not
# the mutable-default bug B008 looks for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these, and reformatting generated DDL to fit a line limit makes
# it harder to diff against the table definitions it came from.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# The live smoke test spends money, so a bare `pytest` must not run it. It is
# also gated on FDIP_LIVE_SMOKE=1, because a marker alone is one typo from a bill.
addopts = "-m 'not live'"
markers = [
    "live: contacts the real provider and spends money; needs -m live and FDIP_LIVE_SMOKE=1",
]
