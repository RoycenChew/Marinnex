# The checks CLAUDE.md §8.4 already requires before every commit, run by a
# machine instead of from memory. That is the point: with one owner, the only
# thing making them happen was remembering to.
#
# No secrets, and none needed. The provider stays in mock mode, so nothing here
# can reach DeepSeek or spend anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FDIP_PROVIDER_MODE: mock
      # Required in every mode, because the server refuses to start without one.
      # A fixed value is right here: CI has no issued keys to invalidate.
      FDIP_KEY_PEPPER: ci-only-pepper-not-a-secret-0123456789
      FDIP_SESSION_SECRET: ci-only-session-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Without the binary, `tests/test_scan_safety.py` skips itself, and the
      # scan route is the part of this system with a known bad measurement.
      # Skipping it quietly in CI is the opposite of what CI is for.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      # The toolkit is a sibling checkout locally and a public tag here. Pinned
      # to v0.9.0: this repository depends on that version, not on whatever its
      # main branch happens to be.
      - name: Install the toolkit and this package
        run: |
          python -m pip install --upgrade pip
          pip install "toolkit @ git+https://github.com/RoycenChew/Toolkits_Management@v0.9.0"
          pip install pdfplumber
          pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q

      - name: ruff
        run: python -m ruff check fdip tests

      - name: mypy
        run: python -m mypy fdip --exclude 'tests'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so a type error fails here.
      - run: npm run build
